name: skillhub-selfhost

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_DB: skillhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TRUSTED_PROXIES: 172.30.41.0/24
      PORT: "3001"
      SKILLHUB_PROFILE: selfhost
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Run install.sh first}
      DATABASE_URL: postgresql://skillhub:${POSTGRES_PASSWORD:?Run install.sh first}@postgres:5432/skillhub
      JWT_SECRET: ${JWT_SECRET:?Run install.sh first}
      CREDENTIAL_KEK_BASE64: ${CREDENTIAL_KEK_BASE64:?Run install.sh first}
      CREDENTIAL_KEK_VERSION: ${CREDENTIAL_KEK_VERSION:-1}
      CREDENTIAL_KEK_KEYRING_JSON: "${CREDENTIAL_KEK_KEYRING_JSON:-{}}"
      MEDIA_STORAGE_DIR: /var/lib/skillhub/media
      SKILL_CARD_STORAGE_DIR: /var/lib/skillhub/cards
      STORAGE_DEFAULT: ${STORAGE_DEFAULT:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media-data:/var/lib/skillhub/media
      - cards-data:/var/lib/skillhub/cards
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

networks:
  # All services use this private bridge, including Caddy and the host gateway.
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.41.0/24
          gateway: 172.30.41.1

volumes:
  postgres-data:
  media-data:
  cards-data:
