[package]
name = "skillhub"
version = "0.32.1"
edition = "2021"

[lib]
name = "skillhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ring = { version = "=0.17.14", default-features = false }
tauri         = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog  = "2"
tauri-plugin-opener  = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
dirs          = "5"
walkdir       = "2"
regex         = "1"
reqwest       = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rustls        = { version = "=0.23.42", default-features = false, features = ["std"] }
git2          = { version = "0.21", default-features = false }
anyhow        = "1"
tokio         = { version = "1", features = ["full"] }
open          = "5"
base64        = "0.22"
sha2          = "0.10"
libc          = "0.2"
uuid          = { version = "1", features = ["v4"] }
zip           = { version = "2", default-features = false, features = ["deflate"] }
zeroize       = "1.8"
# Already in the tree through `url`; account sync NFC-normalizes package paths
# exactly like the server's `skillhub-content-v1` content hash.
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
junction = { version = "2", default-features = false }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
