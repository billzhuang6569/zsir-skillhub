name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          count=0
          while read -r commit; do
            expected="Signed-off-by: $(git show -s --format='%an <%ae>' "$commit")"
            if ! git show -s --format=%B "$commit" | git interpret-trailers --parse | grep -Fx -- "$expected" >/dev/null; then
              echo "DCO missing or author mismatch: $commit"
              exit 1
            fi
            count=$((count + 1))
          done < <(git rev-list "$BASE..$HEAD")
          test "$count" -gt 0

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefix desktop
      # Only general script tests selected by the export manifest exist here.
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-guide.mjs
      - run: node scripts/verify-official-channel.mjs

  server:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [selfhost, yitan-official]
    env:
      SKILLHUB_PROFILE: ${{ matrix.profile }}
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # config-schema tests explicitly cover both profiles; Vitest fixes its default.
      - run: npm ci && npx prisma validate && npm test && npm run build

  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm test && npm run build

  rust:
    # The APP ships for macOS and Windows only; build the Rust core where it runs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: npm ci --prefix desktop && npm run build --prefix desktop
      - working-directory: desktop/src-tauri
        run: cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
